name: Update article index

on:
  push:
    branches:
      - main
    paths:
      - "ai4math/**/index.html"
      - "domain-theory/**/index.html"
      - "notes/**/index.html"
      - "scripts/build-article-index.mjs"
      - ".github/workflows/update-article-index.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: article-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Regenerate the article index
        run: |
          git pull --rebase origin main
          node scripts/build-article-index.mjs
          node scripts/test-article-navigation.mjs

      - name: Commit an updated index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/articles.json ai4math/index.html domain-theory/index.html notes/index.html)" ]; then
            echo "Article index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json ai4math/index.html domain-theory/index.html notes/index.html
          git commit -m "Update generated article index"
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
